name: Build core module Python distribution package and publish to PyPI

on:
  push:
    paths:
      - ".github/workflows/build_and_publish_pypi.yml"
      - "packaging/**"
      - "starlink_grpc.py"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0  # needed for setuptools-scm
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build a wheel and a source distribution
      run: python3 -m build
      working-directory: ./packaging
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: packaging/dist/

  publish-to-pypi:
    name: Publish package to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/starlink-grpc-core
    permissions:
      id-token: write

    steps:
    - name: Download the dist
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
